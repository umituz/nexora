<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sosyal Medya Raporu - Zehra Yılmaz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .platform-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }
        .platform-card:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .platform-icon {
            width: 40px;
            height: 40px;
            margin-right: 15px;
        }
        .platform-info {
            flex-grow: 1;
        }
        .status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .status-found {
            color: #27ae60;
            background-color: #eafaf1;
        }
        .status-not-found {
            color: #c0392b;
            background-color: #fdedec;
        }
        .status-unknown {
            color: #f39c12;
            background-color: #fef9e7;
        }
        .search-variations {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .timestamp {
            color: #95a5a6;
            font-size: 0.8em;
            text-align: right;
            margin-top: 20px;
        }
        .suggestions {
            background-color: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Sosyal Medya Raporu</h1>
        <h2>👤 Zehra Yılmaz</h2>
        <div class="suggestions">
            <h3>🎯 Arama Varyasyonları</h3>
            <ul>
                <li>Tam Ad: Zehra Yılmaz</li>
                <li>Noktalı: zehra.yılmaz</li>
                <li>Alt Çizgili: zehra_yılmaz</li>
            </ul>
        </div>
        <div id="platforms">
        </div>
        <div class="timestamp">
            <p>Rapor oluşturulma tarihi: 26 February 2025, 08:46</p>
        </div>
    </div>
</body>
</html>
